<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Acceso · DiagramIQ</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17324d;background:#eef4f9}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(420px,100%);background:#fff;border:1px solid #d9e5ef;border-radius:18px;padding:28px;box-shadow:0 18px 55px rgba(20,51,79,.12)}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#1769aa;color:#fff;font-weight:900;font-size:22px}
    h1{margin:0;font-size:1.5rem}.sub{margin:5px 0 0;color:#66788a} label{display:block;margin:15px 0 6px;font-weight:750}
    input{width:100%;padding:12px 13px;border:1px solid #bfcfdd;border-radius:10px;font-size:16px;outline:none}input:focus{border-color:#1769aa;box-shadow:0 0 0 3px rgba(23,105,170,.12)}
    button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:#1769aa;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
    .hint{margin-top:16px;font-size:.82rem;color:#718092;line-height:1.45}.error{display:none;margin-top:14px;padding:10px;border-radius:9px;background:#fff1f0;color:#9e2a22;font-size:.9rem}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="icon">D</div><div><h1>DiagramIQ</h1><p class="sub">Acceso protegido</p></div></div>
    <form id="loginForm" action="/auth/login" method="post">
      <label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Ingresar</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <p class="hint">La sesión se mantiene solamente en este navegador mediante una cookie segura. No compartas la contraseña.</p>
  </main>
<script>
const form=document.getElementById('loginForm'), box=document.getElementById('error');
form.addEventListener('submit',async(e)=>{e.preventDefault();box.style.display='none';const fd=new FormData(form);try{const r=await fetch('/auth/login',{method:'POST',body:fd,redirect:'follow'});if(r.ok){location.href='/';return;}let m='No se pudo iniciar sesión.';try{const d=await r.json();m=d.detail||m}catch{}box.textContent=m;box.style.display='block'}catch{box.textContent='No se pudo conectar con el servidor.';box.style.display='block'}});
</script>
</body>
</html>
